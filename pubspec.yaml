name: dogma_y_fe_radio
description: "Dogma y Fe Radio"
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.4
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/huguenot_cross.png
flutter_native_splash:
  color: "#071A33"
  image: assets/splash/splash_logo.png

  android_12:
    color: "#071A33"
    image: assets/splash/splash_logo.png

  android: true
  ios: true
  web: false